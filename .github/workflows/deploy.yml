name: CD - Deploy Application

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: sports-facility-booking
  ASG_NAME: assignment-asg
  ARTIFACT_PREFIX: artifacts

jobs:
  infra:
    name: Apply infrastructure
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build and roll out application
    needs: infra
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install application dependencies
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --optimize-autoloader

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip . -x "uploads/*"

      - name: Upload release to S3
        run: aws s3 cp assignment-app.zip "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/assignment-app.zip"

      # The AWS Academy SCP blocks StartInstanceRefresh. Replacing the ASG via
      # Terraform is permitted and launches a fresh fleet from the latest
      # launch-template version. Each new instance downloads the release above
      # through user-data, so GitHub Actions remains the deployment runner.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Initialize Terraform state
        working-directory: infra/envs/sandbox
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -reconfigure \
            -backend-config="bucket=amit3253-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=sandbox/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=amit3253-terraform-lock" \
            -backend-config="encrypt=true"

      - name: Replace ASG using Terraform
        working-directory: infra/envs/sandbox
        run: terraform apply -auto-approve -replace="module.asg.aws_autoscaling_group.app"

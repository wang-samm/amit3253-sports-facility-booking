name: CD - Deploy Application

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: sports-facility-booking
  ASG_NAME: assignment-asg
  ARTIFACT_PREFIX: artifacts

jobs:
  infra:
    name: Apply infrastructure
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build and roll out application
    needs: infra
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install application dependencies
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --optimize-autoloader

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip . -x "uploads/*"

      - name: Upload release to S3
        run: aws s3 cp assignment-app.zip "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/assignment-app.zip"

      # AWS Academy instances may not register with Systems Manager. A rolling
      # instance refresh needs no inbound access or SSM: each replacement runs
      # user-data, downloads the S3 release and initializes the RDS schema.
      - name: Start Auto Scaling rolling deployment
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences MinHealthyPercentage=50,InstanceWarmup=300 \
            --query InstanceRefreshId --output text)
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for rolling deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "${{ steps.refresh.outputs.refresh_id }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Instance refresh status: $STATUS (check $i/60)"
            if [ "$STATUS" = "Successful" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG_NAME" \
                --instance-refresh-ids "${{ steps.refresh.outputs.refresh_id }}"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for the Auto Scaling rolling deployment."
          exit 1

name: CI - Build Infrastructure

# Reusable workflow (workflow_call) - invoked by ci.yml directly for plan/destroy,
# and by deploy.yml to apply infra before a code deploy. Also kept independently
# manually runnable (workflow_dispatch) - infra changes are never applied
# automatically on push either way.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
  workflow_call:
    inputs:
      action:
        description: "Terraform action to run (plan / apply / destroy)"
        required: true
        type: string
    outputs:
      s3_bucket:
        description: "Resolved uploads/artifacts S3 bucket name (from terraform output). Only populated on apply."
        value: ${{ jobs.terraform.outputs.s3_bucket }}

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/envs/sandbox
  # Optional: create the ALERT_EMAIL repository secret to subscribe that
  # address to operational alerts. A missing secret becomes an empty string,
  # so plans and deployments still work without an email subscription.
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    outputs:
      s3_bucket: ${{ steps.tf_output.outputs.s3_bucket }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Bootstrap remote Terraform state
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="amit3253-tfstate-${ACCOUNT_ID}"
          LOCK_TABLE="amit3253-terraform-lock"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$LOCK_TABLE" --billing-mode PAY_PER_REQUEST --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE"
          fi

          echo "TF_STATE_BUCKET=$STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_LOCK_TABLE=$LOCK_TABLE" >> "$GITHUB_ENV"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -reconfigure -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=sandbox/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="dynamodb_table=$TF_LOCK_TABLE" -backend-config="encrypt=true"

      # One-time migration for AWS Academy: an earlier aws_s3_bucket resource
      # cannot be refreshed because the lab SCP denies the provider's automatic
      # GetBucketObjectLockConfiguration call. Forget only its state record;
      # terraform_data below adopts the already-existing bucket through the CLI.
      - name: Migrate restricted S3 state
        run: |
          if terraform state list | grep -qx 'module.s3.aws_s3_bucket.uploads'; then
            terraform state rm 'module.s3.aws_s3_bucket.uploads'
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      # Expose the resolved bucket name so deploy.yml (which calls this workflow)
      # can target the right bucket without hardcoding it - Terraform stays the
      # single source of truth for the name.
      - name: Capture Terraform outputs
        id: tf_output
        if: ${{ inputs.action == 'apply' }}
        run: echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
